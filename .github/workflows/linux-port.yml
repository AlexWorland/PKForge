name: linux-port

on:
  push:
    paths:
      - 'src/**'
      - 'ports/linux/**'
      - '.github/workflows/linux-port.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'ports/linux/**'
      - '.github/workflows/linux-port.yml'

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install display and runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth x11-apps imagemagick \
            libgtk-3-0t64 libsdl2-2.0-0 libfontconfig1 \
            libegl1 libgles2 libgl1 libgl1-mesa-dri \
            libxkbcommon0 libxkbcommon-x11-0

      - name: Test
        run: dotnet test ports/linux/PKForge.Linux.Tests

      - name: Build the Linux head
        run: dotnet build ports/linux/PKForge.Linux -r linux-x64

      - name: Smoke
        run: SMOKE_OUT="$RUNNER_TEMP/smoke" ports/linux/packaging/smoke.sh

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-png
          path: ${{ runner.temp }}/smoke/smoke.png
          if-no-files-found: ignore
